<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CGV 상영시간표</title>

  <!-- Excel 파일 생성용 SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- 지역/극장 코드 데이터 (CGV_극장코드.xlsx 기준) -->
  <script src="theaters.js"></script>

  <style>
    /*
     * 색은 한 곳에만 쓴다.
     *   #e5101d  CGV 레드 - 조회 버튼과 브랜드 점에만
     *   그 외는 무채색. 색이 있는 것은 포스터와 잔여 임박 표시뿐.
     */
    :root {
      --red: #e5101d;
      --red-dark: #c00d18;
      --ink: #1a1a1a;
      --ink-2: #555;
      --ink-3: #999;
      --line: #ececec;
      --line-2: #e0e0e0;
      --bar: #1a1a1d;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- 상단 바 ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 900;
      background: var(--bar);
    }

    .topbar-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: 11px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .brand .dot { color: var(--red); }

    .divider {
      width: 1px;
      height: 17px;
      background: #3a3a3f;
      margin: 0 2px;
    }

    .topbar-spacer { flex: 1; }

    .topbar input,
    .topbar select {
      background: #26262b;
      border: 1px solid #3a3a40;
      color: #e6e6e9;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 13px;
      font-family: inherit;
      max-width: 190px;
    }

    .topbar select { cursor: pointer; }

    .topbar input:hover,
    .topbar select:hover { border-color: #55555c; }

    .topbar input:focus,
    .topbar select:focus {
      outline: none;
      border-color: #7a7a83;
    }

    /* 날짜 입력의 달력 아이콘을 어두운 배경에 맞춤 */
    .topbar input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
    }

    button {
      font-family: inherit;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      padding: 7px 13px;
      border: 1px solid transparent;
      background: none;
      color: inherit;
    }

    .primary {
      background: var(--red);
      color: #fff;
      font-weight: 500;
      padding: 7px 16px;
    }

    .primary:hover { background: var(--red-dark); }

    .primary:disabled {
      background: #55555c;
      cursor: wait;
    }

    .bar-button {
      border-color: #4a4a50;
      color: #c9c9cf;
    }

    .bar-button:hover {
      border-color: #6d6d75;
      color: #fff;
    }

    .filter-count {
      display: none;
      background: var(--red);
      color: #fff;
      border-radius: 9px;
      padding: 0 6px;
      font-size: 11px;
      margin-left: 5px;
    }

    .filter-count.on { display: inline-block; }

    /* ---------- 본문 ---------- */
    .content {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    #status {
      font-size: 12.5px;
      color: var(--ink-3);
      padding: 14px 0 4px;
      min-height: 18px;
    }

    #status .error { color: #c0392b; }

    .empty-note {
      color: var(--ink-3);
      padding: 48px 0;
      text-align: center;
      font-size: 13.5px;
    }

    /* ---------- 영화 정보 팝업 ---------- */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      overflow-y: auto;
      padding: 40px 16px;
    }

    .modal-backdrop.open {
      display: block;
    }

    .modal {
      background: #fff;
      max-width: 860px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
      padding: 0;
    }

    .modal-close:hover {
      background: var(--red);
    }

    .modal-body {
      padding: 26px;
    }

    .modal-head {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    .modal-poster {
      width: 190px;
      border-radius: 10px;
      flex-shrink: 0;
      background: #eee;
    }

    .modal-meta {
      flex: 1;
      min-width: 260px;
    }

    .modal-meta h2 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    .modal-original {
      color: #888;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .meta-line {
      margin: 5px 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .meta-line b {
      display: inline-block;
      min-width: 62px;
      color: #555;
    }

    .genre-tag {
      display: inline-block;
      background: #f0f0f0;
      border-radius: 12px;
      padding: 2px 10px;
      margin-right: 5px;
      font-size: 12px;
    }

    /* 평점 카드 */
    .rating-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 22px 0 6px;
    }

    .rating-card {
      flex: 1;
      min-width: 128px;
      border: 1px solid #e3e3e3;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      background: #fafafa;
    }

    .rating-card .label {
      font-size: 12px;
      color: #777;
      margin-bottom: 6px;
    }

    .rating-card .score {
      font-size: 26px;
      font-weight: bold;
      color: #222;
    }

    .rating-card .sub {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }

    .rating-card.audience .score { color: #03c75a; }
    .rating-card.critic   .score { color: #6a3fb5; }
    .rating-card.imdb     .score { color: #d0a200; }
    .rating-card.meta     .score { color: #1976d2; }
    .rating-card.tomato   .score { color: #e5101d; }

    .section-title {
      margin: 24px 0 10px;
      font-size: 16px;
      border-left: 4px solid #e5101d;
      padding-left: 9px;
    }

    .overview {
      font-size: 14px;
      line-height: 1.7;
      color: #444;
      white-space: pre-wrap;
    }

    .cast-list {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .cast-item {
      width: 88px;
      text-align: center;
      font-size: 12px;
    }

    .cast-item img {
      width: 88px;
      height: 118px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .cast-item .no-photo {
      width: 88px;
      height: 118px;
      border-radius: 8px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 11px;
    }

    .cast-item .nm { font-weight: bold; margin-top: 5px; }
    .cast-item .ch { color: #888; }

    .review {
      border-bottom: 1px solid #eee;
      padding: 11px 0;
      font-size: 13px;
      line-height: 1.6;
    }

    .review:last-child { border-bottom: none; }

    .review .score-badge {
      display: inline-block;
      background: #03c75a;
      color: #fff;
      border-radius: 4px;
      padding: 1px 7px;
      font-weight: bold;
      margin-right: 7px;
      font-size: 12px;
    }

    .review .who {
      color: #999;
      font-size: 12px;
      margin-top: 4px;
    }

    .critic-review {
      background: #faf8ff;
      border-radius: 6px;
      padding: 11px 12px;
      margin-bottom: 6px;
      border-bottom: none;
    }

    .score-badge.critic-badge {
      background: #6a3fb5;
    }

    .critic-review .who {
      color: #6a3fb5;
      font-weight: bold;
    }

    .modal-note {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #999;
      line-height: 1.6;
    }

    .modal-loading {
      padding: 60px 20px;
      text-align: center;
      color: #666;
    }

    .source-fail {
      font-size: 13px;
      color: #a00;
      background: #fff5f5;
      border-radius: 6px;
      padding: 9px 12px;
      margin-top: 8px;
    }

    /* ---------- 조회 결과 (영화별 행) ---------- */
    .movie-card {
      display: flex;
      gap: 14px;
      padding: 14px 0;
      border-top: 1px solid var(--line);
      align-items: center;
    }

    .movie-card:first-child { border-top: none; }

    .card-poster {
      width: 46px;
      height: 66px;
      flex-shrink: 0;
      align-self: center;
      border-radius: 4px;
      object-fit: cover;
      background: #efefef;
      cursor: pointer;
      border: none;
      padding: 0;
      display: block;
    }

    .card-poster:hover { opacity: 0.8; }

    .card-poster-empty {
      width: 46px;
      height: 66px;
      flex-shrink: 0;
      align-self: center;
      border-radius: 4px;
      background: #efefef;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 10px;
      text-align: center;
      cursor: pointer;
    }

    .card-main { flex: 1; min-width: 0; }

    .card-title {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }

    .card-title .name {
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
    }

    .card-title .name:hover {
      color: var(--red);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* 부가정보는 한 줄로 합쳐서 회색 작은 글씨로 */
    .card-meta {
      font-size: 11.5px;
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 등급/타입은 무채색 아웃라인 - 색은 포스터에만 남긴다 */
    .badge {
      display: inline-block;
      border: 1px solid var(--line-2);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 11px;
      color: var(--ink-3);
      white-space: nowrap;
    }

    .time-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    /*
     * 상영시간 버튼
     *
     * 화면에 이미 포스터 이미지와 등급/타입 뱃지가 색을 쓰고 있어서
     * 기본 상태는 무채색(차콜)으로 두고, 잔여 임박만 앰버로 강조한다.
     */
    /*
     * 상영시간 버튼
     *
     * 한 줄짜리 컴팩트 형태. 상영관은 앞에 작은 회색 글씨로 붙인다.
     * 기본은 무채색이고, 잔여 임박일 때만 레드 계열로 신호를 준다.
     */
    .time-chip {
      background: #f4f4f5;
      color: var(--ink);
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 5px 9px;
      cursor: pointer;
      font-size: 12.5px;
      line-height: 1.4;
      white-space: nowrap;
      transition: background 0.12s, border-color 0.12s;
    }

    .time-chip:hover {
      background: #fff;
      border-color: var(--ink-3);
    }

    .time-chip .screen {
      font-size: 10.5px;
      color: var(--ink-3);
      margin-right: 4px;
    }

    .time-chip .start { font-weight: 500; }

    .time-chip .end {
      color: var(--ink-3);
      font-size: 11.5px;
      margin-left: 4px;
    }

    /* 잔여 좌석 20% 이하 */
    .time-chip.few {
      background: #fdeeee;
      color: #a32d2d;
    }

    .time-chip.few:hover {
      background: #fff;
      border-color: #d98a8a;
    }

    .time-chip.few .screen { color: #c0605d; }
    .time-chip.few .end    { color: #c0605d; }

    /* 매진 */
    .time-chip.soldout {
      background: #f7f7f7;
      color: #bbb;
    }

    .time-chip.soldout:hover {
      background: #f7f7f7;
      border-color: var(--line-2);
    }

    .time-chip.soldout .screen,
    .time-chip.soldout .end { color: #c9c9c9; }

    /* 상영회차 상세 툴팁 */
    .session-tip {
      display: none;
      position: fixed;
      z-index: 1200;
      background: rgba(28,28,30,0.96);
      color: #fff;
      border-radius: 8px;
      padding: 11px 13px;
      font-size: 12.5px;
      line-height: 1.65;
      max-width: 300px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      pointer-events: none;
    }

    .session-tip.show { display: block; }

    .session-tip .tip-title {
      font-weight: bold;
      font-size: 13.5px;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .session-tip b {
      display: inline-block;
      min-width: 62px;
      color: #9fd8f0;
      font-weight: normal;
    }

    /* 필터 팝업 */
    .filter-modal { max-width: 560px; }

    .filter-group {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .filter-group h4 {
      margin: 0 0 8px;
      font-size: 13px;
      color: #777;
    }

    .filter-group label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 0 14px 6px 0;
      font-weight: normal;
      font-size: 14px;
      cursor: pointer;
    }

    .filter-group input { width: 15px; height: 15px; }

    .filter-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .filter-actions button {
      border-color: var(--line-2);
      color: var(--ink-2);
      padding: 7px 14px;
    }

    .filter-actions button:hover {
      border-color: var(--ink-3);
      color: var(--ink);
    }

    .filter-actions .primary {
      border-color: var(--red);
      color: #fff;
    }

    .filter-actions .primary:hover {
      border-color: var(--red-dark);
      color: #fff;
    }
  </style>
</head>

<body>

<!-- 조회 조건을 한 줄로 접은 상단 바 -->
<header class="topbar">

  <div class="topbar-inner">

    <span class="brand">CGV<span class="dot">.</span> 상영시간표</span>

    <span class="divider"></span>

    <input type="date" id="date" aria-label="날짜" />

    <!-- 지역/극장 목록은 theaters.js 에서 자동 생성 -->
    <select id="region" aria-label="지역" onchange="onRegionChange()"></select>
    <select id="theater" aria-label="극장"></select>

    <button id="searchBtn" class="primary" onclick="searchSchedule()">조회</button>

    <span class="topbar-spacer"></span>

    <button
      id="filterBtn"
      class="bar-button"
      onclick="openFilterModal()"
      style="display:none;"
    >필터<span id="filterCount" class="filter-count"></span></button>

    <button
      id="downloadBtn"
      class="bar-button"
      onclick="downloadExcel()"
      style="display:none;"
    >Excel</button>

  </div>

</header>


<main class="content">

  <div id="status"></div>

  <div id="result" class="empty-note">
    날짜와 극장을 선택하고 조회를 누르세요.
  </div>

</main>


<!-- 상영회차 상세 툴팁 (마우스 오버 시 표시) -->
<div id="sessionTip" class="session-tip"></div>


<!-- 필터 설정 팝업 -->
<div
  class="modal-backdrop"
  id="filterModal"
  onclick="onFilterBackdropClick(event)"
>
  <div class="modal filter-modal">
    <button class="modal-close" onclick="closeFilterModal()">&times;</button>

    <div class="modal-body">
      <h2 style="margin-top:0;">필터 설정</h2>
      <div id="filterBody"></div>

      <div class="filter-actions">
        <button onclick="setAllFilters(true)">전체 선택</button>
        <button onclick="setAllFilters(false)">전체 해제</button>
        <button class="primary" onclick="closeFilterModal()">닫기</button>
      </div>
    </div>
  </div>
</div>


<!-- 영화 상세정보 팝업 -->
<div
  class="modal-backdrop"
  id="movieModal"
  onclick="onBackdropClick(event)"
>
  <div class="modal">
    <button class="modal-close" onclick="closeMovieModal()">&times;</button>
    <div id="movieModalBody"></div>
  </div>
</div>


<script>

let currentRows = [];        // 화면에 그려진 순서와 동일한 엑셀용 행
let currentSiteName = "";

let allSessions = [];        // 조회된 전체 상영회차 (필터 적용 전)
let visibleSessions = [];    // 화면에 표시 중인 회차 (툴팁 참조용)
let filterOptions = {};      // { 필드: [선택 가능한 값들] }
let filterState = {};        // { 필드: Set(선택된 값들) }


/*
 * 지역 선택 박스를 theaters.js 데이터로 채운다.
 */
function initRegionSelect() {

  const regionElement =
    document.getElementById("region");

  regionElement.innerHTML = "";

  for (const item of CGV_REGIONS) {

    const option =
      document.createElement("option");

    option.value = item.region;
    option.textContent = item.region;

    regionElement.appendChild(option);

  }

}


/*
 * 선택된 지역의 극장 목록으로 극장 선택 박스를 채운다.
 *
 * selectedSiteNo 가 해당 지역에 있으면 그 극장을,
 * 없으면 첫 번째 극장을 선택한다.
 */
function fillTheaterSelect(regionName, selectedSiteNo) {

  const theaterElement =
    document.getElementById("theater");

  theaterElement.innerHTML = "";

  const found =
    CGV_REGIONS.find(
      item => item.region === regionName
    );

  if (!found) {
    return;
  }

  for (const theater of found.theaters) {

    const option =
      document.createElement("option");

    option.value = theater.code;
    option.textContent = "CGV " + theater.name;

    theaterElement.appendChild(option);

  }

  if (selectedSiteNo) {
    theaterElement.value = selectedSiteNo;
  }

  // 지정한 코드가 이 지역에 없으면 첫 번째 극장으로 대체
  if (!theaterElement.value) {
    theaterElement.selectedIndex = 0;
  }

}


/*
 * 지역 변경 시 극장 목록 갱신
 */
function onRegionChange() {

  const regionElement =
    document.getElementById("region");

  fillTheaterSelect(regionElement.value, null);

}


/*
 * YYYY-MM-DD → YYYYMMDD
 */
function convertDate(dateString) {
  return dateString.replaceAll("-", "");
}


/*
 * 20260808 → 2026-08-08
 */
function formatDate(yyyymmdd) {

  if (!yyyymmdd || yyyymmdd.length !== 8) {
    return yyyymmdd;
  }

  return (
    yyyymmdd.substring(0, 4) + "-" +
    yyyymmdd.substring(4, 6) + "-" +
    yyyymmdd.substring(6, 8)
  );
}


/*
 * 0940 → 09:40
 *
 * CGV 데이터에서는
 * 24:00 이후 시간이
 *
 * 2435
 * 2605
 *
 * 같은 형태로 올 수 있음.
 */
function formatStartTime(value) {

  if (!value || value.length !== 4) {
    return value;
  }

  const hour = Number(value.substring(0, 2));
  const minute = value.substring(2, 4);

  if (hour >= 24) {
    return `익일 ${String(hour - 24).padStart(2, "0")}:${minute}`;
  }

  return `${String(hour).padStart(2, "0")}:${minute}`;
}


/*
 * 종료 시간 처리
 *
 * 2605 → 익일 02:05
 */
function formatEndTime(value) {

  if (!value || value.length !== 4) {
    return value;
  }

  const hour = Number(value.substring(0, 2));
  const minute = value.substring(2, 4);

  if (hour >= 24) {
    return `익일 ${String(hour - 24).padStart(2, "0")}:${minute}`;
  }

  return `${String(hour).padStart(2, "0")}:${minute}`;
}


/*
 * Node.js 서버(server.js)의 /api/schedule 엔드포인트를 호출한다.
 * 서버가 대신 CGV API를 호출하므로 브라우저 CORS 문제가 발생하지 않는다.
 */
async function fetchCgvData(siteNo, scnYmd, statusElement) {

  statusElement.textContent =
    "CGV 데이터를 조회하고 있습니다...";

  const requestUrl =
    "/api/schedule" +
    "?siteNo=" + encodeURIComponent(siteNo) +
    "&scnYmd=" + encodeURIComponent(scnYmd);

  const controller = new AbortController();

  const timeoutId = setTimeout(
    () => controller.abort(),
    10000
  );

  let response;

  try {

    response = await fetch(requestUrl, {

      method: "GET",

      headers: {
        "Accept": "application/json"
      },

      signal: controller.signal

    });

  } finally {

    clearTimeout(timeoutId);

  }

  const json = await response.json();

  if (!response.ok) {

    throw new Error(
      json.error ||
      ("HTTP " + response.status)
    );

  }

  return json;

}
