<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <meta name="description" content="D&Rep's Work — 유용한 도구와 프로젝트 모음">
  <title>D&Rep's Work</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3f2ec;
      --muted: #9da49d;
      --line: rgba(238, 241, 227, .15);
      --lime: #c9f36a;
      --bg: #101411;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 78% 18%, rgba(92, 123, 58, .16), transparent 36rem),
        radial-gradient(ellipse at 6% 94%, rgba(72, 100, 95, .12), transparent 32rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 30px clamp(22px, 6vw, 88px) 24px;
    }
    a { color: inherit; }
    .topbar, footer { display: flex; align-items: center; justify-content: space-between; }
    .mark { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; letter-spacing: .06em; }
    .mark-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 18px rgba(201, 243, 106, .65); }
    .edition { color: var(--muted); font-size: 12px; letter-spacing: .06em; }
    main { width: min(100%, 1040px); margin: auto; padding: 78px 0 86px; }
    .eyebrow { color: var(--lime); font-size: 12px; font-weight: 650; letter-spacing: .12em; }
    h1 { margin: 20px 0 18px; font-size: clamp(2rem, 9vw, 7.8rem); line-height: 1; font-weight: 540; letter-spacing: -.075em; white-space: nowrap; }
    h1 span { color: var(--lime); }
    .intro { max-width: 440px; margin: 0; color: var(--muted); font-size: clamp(15px, 1.7vw, 18px); line-height: 1.7; }
    .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 64px; }
    .card { position: relative; min-height: 208px; padding: 27px 28px 24px; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.018)); text-decoration: none; transition: border-color .2s ease, transform .2s ease, background .2s ease; }
    .card:hover, .card:focus-visible { border-color: rgba(201, 243, 106, .65); background: linear-gradient(145deg, rgba(201,243,106,.09), rgba(255,255,255,.025)); transform: translateY(-3px); outline: none; }
    .card-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { color: var(--lime); font-size: 20px; transition: transform .2s ease; }
    .card:hover .arrow { transform: translate(3px, -3px); }
    h2 { margin: 42px 0 8px; font-size: clamp(21px, 3vw, 29px); font-weight: 520; letter-spacing: -.035em; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    footer { border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); font-size: 11px; letter-spacing: .06em; }
    footer .signature { color: var(--ink); }
    @media (max-width: 620px) {
      body { padding: 22px 20px 18px; }
      main { padding: 76px 0 66px; }
      .projects { grid-template-columns: 1fr; gap: 12px; margin-top: 44px; }
      .card { min-height: 176px; padding: 22px; }
      h2 { margin-top: 32px; }
      .edition { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="mark"><span class="mark-dot" aria-hidden="true"></span> 개인 프로젝트</div>
    <div class="edition">프로젝트 모음 · 01—02</div>
  </header>

  <main>
    <div class="eyebrow">유용한 도구와 프로젝트 모음</div>
    <h1>D&amp;Rep's <span>Work.</span></h1>
    <p class="intro">직접 만든 도구와 프로젝트를 모았습니다. 원하는 서비스를 선택해 시작하세요.</p>

    <nav class="projects" aria-label="Projects">
      <a class="card" href="https://dnrep.dothome.co.kr/cgv-schedule-app">
        <div class="card-top"><span>01 / 영화</span><span class="arrow" aria-hidden="true">↗</span></div>
        <h2>CGV 극장 예약</h2>
        <p>CGV 극장 상영 일정과 예약 서비스를 이용하세요.</p>
      </a>
      <a class="card" href="https://dnrep.dothome.co.kr/yangbeol-courts">
        <div class="card-top"><span>02 / 코트</span><span class="arrow" aria-hidden="true">↗</span></div>
        <h2>양벌돔 코드 예약</h2>
        <p>양벌돔 코트 예약 서비스를 이용하세요.</p>
      </a>
    </nav>
  </main>

  <footer>
    <span class="signature">D&amp;Rep's Work</span>
    <span>정성껏 만들었습니다</span>
  </footer>
</body>
</html>
